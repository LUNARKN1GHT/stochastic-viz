[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stochastic-viz"
version = "0.1.0"
description = "Stochastic process visualizations using Manim — Ross & Shreve"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "manim>=0.18",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["utils*", "scenes*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "SIM",      # flake8-simplify
    "ANN",      # flake8-annotations (type hints)
    "NPY",      # numpy-specific rules
]
ignore = [
    "ANN101",   # self 不需要标注类型
    "ANN102",   # cls 不需要标注类型
    "ANN201",   # construct 等 Manim 入口方法返回 None，不标
    "F403",     # from manim import * 是 Manim 官方惯例
    "F405",     # * 导入后名字可能来自 manim，误报
]

[tool.ruff.lint.isort]
known-first-party = ["utils"]
